# sha256 2f8cf1a1e92822a9c1921b8c934d944ca91d36ff9f33b6b06fd22de890ccd57c) gives only a MAXIMUM
# forward voltage (1.0 V at 5 mA), maximum leakage and typical capacitance (0.8 pF). Waiting for a
