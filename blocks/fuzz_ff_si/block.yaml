id: fuzz_ff_si
category: fuzz
name: "Fuzz Face, silicon (GGG)"
character: >
  Two direct-coupled NPN transistors with DC feedback (R3). No diodes: clipping
  comes from transistor saturation/cutoff, strongest and most asymmetric of the
  library (rich even harmonics when the bias is off-center). Very low input
  impedance interacts with the guitar pickup, so it behaves differently when
  not first in the chain. Bias depends strongly on transistor gain.
source:
  schematic: "GGG Fuzz Face (Silicon Transistor Version) schematic, version 2011Dec09"
  layout: null
  url: "https://generalguitargadgets.com/how-to-build-it/technical-help/schematics/"
  note: >
    Schematic gives no transistor part number ("Silicon"); Q_model is a choice.
    The FF5 layout is the germanium version and differs. Do not redistribute
    GGG PDFs; link only.
template: template.cir.j2
subckt: fuzz_ff_si
ports: [in, out, vcc, gnd]
supply_v: 9.0

models: {}

chain_hint: "Prefers to be first in the chain (directly after the pickup)."
prefers_first: true   # Validate warns if not first (impedance-sensitive input)

params:
  fuzz:    {type: pot, designator: R6, r_total: 1k, taper: linear, invert: true, mode: divider, default: 0.5,
            note: "1 = wiper at Q2 emitter (C2 fully bypasses, max gain)"}
  volume:  {type: pot, designator: R10, r_total: 500k, taper: log, mode: divider, default: 0.5}
  Q_model: {type: choice, designators: [Q1, Q2], choices: [Q2N3904, QBC549C], default: QBC549C,
            note: "Default QBC549C (stand-in for the obsolete BC109C): the only choice for which the
                   GGG part values (R5 = 8.2k) pass the DC check. Q2N3904 has much lower hFE and needs
                   R5 = 4.7k-6.8k (scripts/bjt_study.py). Both models are fitted to onsemi datasheet
                   curves; operating currents are mostly below the data (models/README.md)",
            # HINT ONLY: shown in the Planner's catalog and applied by tests/smoke_block.py.
            # Build never applies it: with Q2N3904 and no R5 given, R5 stays at its default 8.2k.
            recommended: {Q2N3904: {R5: 5.6k}}}
  R5:      {type: component, value: 8.2k, min: 4.7k, max: 12k, series: E12,
            note: "Q2 collector load; sets the Q2 bias (smaller R5 = higher V(c2)). Measured with the fitted
                   models (scripts/bjt_study.py): QBC549C at 8.2k gives V(c2) = 3.52 V; Q2N3904 at 8.2k
                   fails the c2 DC check (1.95 V nominal hFE), R5 = 4.7k-6.8k biases it correctly across
                   its datasheet hFE range. Q2 bias also sets the fuzz asymmetry (even_odd)"}
  C1:      {type: component, value: 2.2u, min: 100n, max: 4.7u, series: E6,
            note: "input coupling; smaller = less bass into the fuzz"}

typical_metrics:   # generated by scripts/fill_typical_metrics.py: defaults, 1000 Hz 300 mV EMF, models opamps.lib+diodes_fitted.lib+bjts_fitted.lib
  Q_model=Q2N3904 (recommended R5=5.6k): {gain_1k_db: -8.95, ac_peak_db: -1.37, ac_peak_hz: 132, thd_pct: 36.6, even_odd: 0.569, out_pk_v: 0.0232}
  Q_model=QBC549C: {gain_1k_db: -8.67, ac_peak_db: -1.02, ac_peak_hz: 132, thd_pct: 38.6, even_odd: 0.581, out_pk_v: 0.0167}

dc_checks:
  b1: {node: b1, expect: [0.4, 0.8]}
  c2: {node: c2, expect: [2.0, 7.0]}
