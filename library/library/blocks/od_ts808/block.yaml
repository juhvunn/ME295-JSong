id: od_ts808
category: overdrive
name: "Tube Screamer TS-808 (GGG ITS8)"
character: >
  Soft clipping (diodes in op-amp feedback). Bass is clipped least because of
  the ~720 Hz high-pass in the feedback loop; treble is cut by a ~723 Hz passive
  low-pass after clipping, giving the characteristic mid hump. Keeps picking
  dynamics; mild-to-medium gain.
source:
  schematic: "GGG ITS8 schematic, version 2009Sep18"
  layout: "GGG ITS8 parts layout, version 2019Oct8"
  url: "https://generalguitargadgets.com/effects-projects/distortion/tube-screamer/"
  note: "Do not redistribute GGG PDFs; link only."
template: template.cir.j2
subckt: od_ts808
ports: [in, out, vcc, gnd]
supply_v: 9.0

# Models the template expects (defined in models/). Op-amp wrapper pin order:
#   inp inn vcc vee out
models:
  opamp_model: JRC4558_HALF
  bjt_model: Q2N4401
  diode_si_model: D1N914
  diode_led_model: DLED_RED

# Agent-adjustable parameters
params:
  drive:   {type: pot, designator: R19, r_total: 500k, taper: log,    mode: rheostat, default: 0.5}
  tone:    {type: pot, designator: R20, r_total: 20k,  taper: linear, mode: divider,  default: 0.5,
            note: "0 = wiper at IC1b+ side (darkest), 1 = wiper at IC1b- side (brightest)"}
  level:   {type: pot, designator: R21, r_total: 100k, taper: linear, mode: divider,  default: 0.5}
  D_clip:  {type: choice, designators: [D1, D2, D3, D4], choices: [si, led, none], default: si,
            note: "si = 1N914 pair, led = red LED pair, none = boost (toggle center position)"}
  C3:      {type: component, value: 47n, min: 22n,  max: 220n, series: E6,
            note: "feedback HPF with R6 4.7k; fc = 1/(2*pi*4.7k*C3) ~ 720 Hz at 47n"}
  C4:      {type: component, value: 51p, min: 22p,  max: 220p, series: E24,
            note: "softens clipped edges; fc depends on drive setting"}

# Filled in from validation runs (tests/smoke_block.py) once real models are fixed
typical_metrics: {}

# Sanity checks for Validate/Checker (DC operating point, default params)
dc_checks:
  vr:  {node: vr, expect: [4.3, 4.7]}
  o1:  {node: o1, expect: [4.0, 5.0]}
  o2:  {node: o2, expect: [4.0, 5.0]}
